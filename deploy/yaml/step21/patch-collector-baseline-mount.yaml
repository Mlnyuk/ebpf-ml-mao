apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-ml-mao-collector
  namespace: ebpf-obs
spec:
  template:
    spec:
      containers:
        - name: collector
          volumeMounts:
            - name: baseline-data
              mountPath: /etc/ebpf-ml-mao/baseline
              readOnly: true
      volumes:
        - name: baseline-data
          configMap:
            name: ebpf-ml-mao-baseline-data
