apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../step19
  - tetragon-fault-file-coverage-policy.yaml
configMapGenerator:
  - name: ebpf-ml-mao-baseline-data
    namespace: ebpf-obs
    files:
      - baseline_tetragon.jsonl=baseline_tetragon.jsonl
      - baseline_prometheus.json=baseline_prometheus.json
    options:
      disableNameSuffixHash: true
patches:
  - path: patch-fault-target-deployment.yaml
    target:
      kind: Deployment
      name: fault-target
      namespace: ebpf-obs-test
  - path: patch-configmap-baseline-paths.yaml
  - path: patch-collector-baseline-mount.yaml
