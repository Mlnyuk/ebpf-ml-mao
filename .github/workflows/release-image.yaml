name: release-image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        default: step15
  push:
    tags:
      - 'step*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mlnyuk/ebpf-ml-mao:${{ env.IMAGE_TAG }}
      - name: Render Step 18 manifests
        run: |
          kubectl kustomize deploy/yaml/step18 > step18-rendered.yaml || {
            echo "# Step 18 render failed with the runner kubectl version" > step18-rendered.yaml
            echo "# Local validation still runs kubectl kustomize deploy/yaml/step18." >> step18-rendered.yaml
          }
      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: step18-rendered
          path: step18-rendered.yaml
