apiVersion: v1
kind: Namespace
metadata:
  name: rca-system
  labels:
    app.kubernetes.io/part-of: selective-rca
---
apiVersion: v1
kind: Namespace
metadata:
  name: rca-lab
  labels:
    app.kubernetes.io/part-of: selective-rca
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab-budget
  namespace: rca-lab
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 512Mi
    limits.cpu: "3"
    limits.memory: 1Gi
    pods: "8"
